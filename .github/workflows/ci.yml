name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Solo se compila el backend (Api + Application + Infrastructure + Domain).
      # CrmVentas.Mobile se excluye de este workflow porque requiere los workloads
      # de .NET MAUI (Android/Windows) que no están disponibles en este runner.
      - name: Restore
        run: dotnet restore src/CrmVentas.Api/CrmVentas.Api.csproj

      - name: Build
        run: dotnet build src/CrmVentas.Api/CrmVentas.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/CrmVentas.Application.Tests/CrmVentas.Application.Tests.csproj --configuration Release
